# Semilla de categorías curada a mano. La app nunca escribe aquí; lo aprendido va
# a categories.learned.yaml.
#
# Un patrón es una subcadena que se compara contra la descripción en mayúsculas y
# sin acentos. `exclude_from_spend: true` saca la categoría del total de gasto.

categorias:
