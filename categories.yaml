  - nombre: Supermercados
  - nombre: Transporte
  - nombre: Salud y Cuidado Personal
  - nombre: Tiendas por Departamento
  - nombre: Entretenimiento
  - nombre: Suscripciones
  - nombre: Viajes
  - nombre: Educación
  - nombre: Otros
  - nombre: Sin categorizar
  - nombre: Pago de tarjeta
    exclude_from_spend: true
  - nombre: Intereses y comisiones
    exclude_from_spend: true
  - nombre: Seguros
    exclude_from_spend: true
  - nombre: Cuota de financiamiento
    exclude_from_spend: true

