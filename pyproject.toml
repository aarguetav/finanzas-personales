[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finanzas-personales"
version = "0.1.0"
description = "App local de finanzas personales con ingestión determinista de estados de cuenta"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11", "pyyaml>=6.0", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx2>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["parsers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
