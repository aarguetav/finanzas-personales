name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download verified Gitleaks release
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan available Git history
        env:
          SCANNER: ${{ runner.temp }}/gitleaks
          SCAN_LOG: ${{ runner.temp }}/gitleaks.log
        run: |
          if "$SCANNER" git --log-opts=--all --redact=100 --no-banner --no-color >"$SCAN_LOG" 2>&1; then
            echo "Gitleaks completed without findings."
          else
            echo "::error::Gitleaks detected findings or could not complete; scan locally to investigate."
            exit 1
          fi
